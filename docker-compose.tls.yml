# Override: serve HTTPS with a certificate you provide.
#
#   mkdir -p certs && cp server.crt server.key certs/
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Set PUBLIC_BASE_URL to https://... in .env. Port 80 keeps answering and
# redirects to HTTPS.
services:
  proxy:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
