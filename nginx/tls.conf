# DataGusto Platform ingress (HTTPS with customer certificate). Single origin: frontend at /, API at /api/.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream datagusto_frontend { server frontend:3000; }
upstream datagusto_backend  { server backend:8000; }


server {
    listen 80;
    server_name _;
    location /health { proxy_pass http://datagusto_backend; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /health {
        proxy_pass http://datagusto_backend;
    }

    location /api/ {
        proxy_pass http://datagusto_backend;
        # LLM-backed endpoints can run for a long time (LLM_*_REQUEST_TIMEOUT_SECONDS).
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://datagusto_frontend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
